min_particles: 300
max_particles: 1500
kld_err: 0.02
kld_z: 0.99
update_min_d: 0.10
update_min_a: 0.20
resample_interval: 1

# Laser model (good for 2D lidar indoors)
laser_model_type: likelihood_field
laser_max_beams: 60
laser_z_hit: 0.90
laser_z_short: 0.10
laser_z_max: 0.05
laser_z_rand: 0.05
laser_sigma_hit: 0.20
laser_lambda_short: 0.10
laser_likelihood_max_dist: 2.0

# Frames
odom_frame_id: odom
base_frame_id: base_footprint
tf_broadcast: true
transform_tolerance: 0.5

# Odom (Kobuki diff drive – tune alphas if you notice drift)
odom_model_type: diff
odom_alpha1: 0.20
odom_alpha2: 0.20
odom_alpha3: 0.20
odom_alpha4: 0.20
odom_alpha5: 0.10

# Initial covariances (modest)
initial_cov_xx: 0.25
initial_cov_yy: 0.25
initial_cov_aa: 0.0685
