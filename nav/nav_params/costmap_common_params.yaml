# Shared by both local and global costmaps
# Footprint ~0.36 x 0.32 m; padding kept tiny for 70 cm corridors
# costmap_common_params.yaml
footprint: [[0.18, 0.00], [0.16, 0.11], [0.00, 0.16], [-0.16, 0.11],
            [-0.18, 0.00], [-0.16, -0.11], [0.00, -0.16], [0.16, -0.11]]
footprint_padding: 0.02


# Sensing ranges (X3 Pro is short/medium range; keep raytrace longer for clearing)
obstacle_range: 3.5
raytrace_range: 5.0

# Layers are configured by name so they can be re-used in both costmaps
static_layer:
  enabled: true
  map_topic: /map
  subscribe_to_updates: true

obstacle_layer:
  enabled: true
  max_obstacle_height: 0.40
  obstacle_range: 3.5
  raytrace_range: 5.0
  track_unknown_space: false        # unknown treated as obstacles in planning
  combination_method: 1
  observation_sources: laser_scan
  laser_scan:
    data_type: LaserScan
    topic: /scan
    clearing: true
    marking: true
    inf_is_valid: true
    expected_update_rate: 0.0
