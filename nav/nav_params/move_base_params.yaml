# Frequencies
controller_frequency: 10.0
planner_frequency: 1.0

# Patience and oscillation
planner_patience: 3.0
controller_patience: 2.0
oscillation_timeout: 10.0
oscillation_distance: 0.5

# Recoveries: disable in-place spin clears for narrow corridors
recovery_behavior_enabled: true
clearing_rotation_allowed: true
conservative_reset_dist: 0.50

# Use DWA
base_local_planner: "dwa_local_planner/DWAPlannerROS"
base_global_planner: "global_planner/GlobalPlanner"

# Global planner (either NavfnROS or GlobalPlanner; pick one)
#navfn/NavfnROS:
#  allow_unknown: false

# GlobalPlanner:
#   use_dijkstra: true
#   use_quadratic: true
#   allow_unknown: false
#   cost_factor: 3.0
#   neutral_cost: 50
#   lethal_cost: 253
#   use_grid_path: false

recovery_behaviors:
  - name: 'conservative_reset1' #clear a small area
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'clearing_rotation1'
    type: 'rotate_recovery/RotateRecovery' #rotate in place

conservative_reset1:
  reset_distance: 0.5
  layer_names : ["obstacle_layer"]
