# Frequencies
controller_frequency: 10.0
planner_frequency: 1.0

# Patience and oscillation
planner_patience: 3.0
controller_patience: 2.0
oscillation_timeout: 5.0
oscillation_distance: 0.25

# Recoveries: disable in-place spin clears for narrow corridors
recovery_behavior_enabled: true
clearing_rotation_allowed: true
conservative_reset_dist: 0.50

# Use DWA
base_local_planner: "dwa_local_planner/DWAPlannerROS"

# Global planner (either NavfnROS or GlobalPlanner; pick one)
#navfn/NavfnROS:
#  allow_unknown: false

GlobalPlanner:
  use_dijkstra: true
  use_quadratic: true
  allow_unknown: false
  cost_factor: 3.0
  neutral_cost: 50
  lethal_cost: 253
  use_grid_path: false
