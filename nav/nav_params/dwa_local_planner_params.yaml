DWAPlannerROS:
  # Speeds (start conservative; you can raise later)
  max_vel_x: 0.30
  min_vel_x: 0.00
  max_vel_theta: 3.0
  min_in_place_vel_theta: 0.50
  acc_lim_x: 0.60
  acc_lim_theta: 3.0

  # Sampling & sim horizon (shorter = less cutting)
  vx_samples: 24
  vtheta_samples: 64
  sim_time: 0.85            # 0.8–1.1 is the sweet spot
  sim_granularity: 0.02
  angular_sim_granularity: 0.02

  # Scoring (follow global path, respect walls)
  path_distance_bias: 110.0  # ↑ stick to path (reduces corner cutting)
  goal_distance_bias: 18.0  # don’t over-pull toward the next waypoint
  occdist_scale: 1.00       # ↑ obstacle cost → wider turns

  forward_point_distance: 0.16  # look a bit closer ahead so it doesn’t “dive” inside
  stop_time_buffer: 0.40
  heading_scoring: true
  heading_scoring_timestep: 0.10

  prune_plan: true
  publish_cost_grid: true
