base_local_planner: base_local_planner/TrajectoryPlannerROS

TrajectoryPlannerROS:
  max_vel_x: 0.45
  min_vel_x: 0.1
  max_vel_theta: 1.0
  min_in_place_vel_theta: 0.4

  acc_lim_theta: 1.5
  acc_lim_x: 1.5
  acc_lim_y: 1.5

  holonomic_robot: false
  dwa: true
  escape_vel: -0.1

  yaw_goal_tolerance: 0.1
  xy_goal_tolerance: 0.2
